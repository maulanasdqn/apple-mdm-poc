[package]
name = "mdm-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["http", "d1"] }
worker-macros = "0.8"
console_error_panic_hook = "0.1"

serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
plist = "1"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }

[profile.release]
opt-level = "s"
lto = true

[workspace]
